name: GitHub Contribution Grid Snake Animation

on:
  schedule:
    - cron: '0 0 * * *'   # runs every day at midnight UTC
  workflow_dispatch:       # lets you run it manually anytime

permissions:
  contents: write

jobs:
  build:
    name: Create Snake Grid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create snake grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: abinivesh-m
          outputs: |
            output/github-contribution-grid-snake.svg

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/
          git commit -m "Update snake animation" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
